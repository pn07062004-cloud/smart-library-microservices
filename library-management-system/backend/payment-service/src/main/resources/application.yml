server.port: 8085
spring:
  application.name: payment-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/library_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
app.jwt.secret: ${JWT_SECRET:SmartLibraryGraduationProjectSecretKey2026MustBeLong}
internal.api-key: ${INTERNAL_API_KEY:SmartLibraryInternalServiceKey2026}
circulation.base-url: ${CIRCULATION_URL:http://localhost:8083}
frontend.base-url: ${FRONTEND_URL:http://localhost:5173}
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
  version: ${VNPAY_VERSION:2.1.0}
  command: ${VNPAY_COMMAND:pay}
  currency-code: ${VNPAY_CURRENCY_CODE:VND}
  locale: ${VNPAY_LOCALE:vn}
  order-type: ${VNPAY_ORDER_TYPE:other}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
